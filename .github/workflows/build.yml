name: Era v3
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then XC=$(ls -d /Applications/Xcode*.app | sort -V | tail -1); fi
          echo "Using $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build device app
        run: |
          xcodebuild -project Era.xcodeproj -scheme Era -configuration Release -sdk iphoneos -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO build
          mkdir -p Payload
          cp -R build/device/Build/Products/Release-iphoneos/Era.app Payload/
          zip -qry Era-v3-unsigned.ipa Payload
      - name: Verify unsigned device IPA
        run: |
          file Payload/Era.app/Era
          lipo -info Payload/Era.app/Era
          test ! -d Payload/Era.app/_CodeSignature
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' Payload/Era.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' Payload/Era.app/Info.plist
      - name: Build simulator
        run: xcodebuild -project Era.xcodeproj -scheme Era -configuration Debug -sdk iphonesimulator -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO build
      - name: Prepare test audio files
        run: |
          mkdir -p testaudio
          python3 - <<'PY'
          import wave, struct, math
          for name, freq in [("Testton Alpha", 440), ("Testton Beta", 523)]:
              w = wave.open(f"testaudio/{name}.wav", "w")
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(44100)
              frames = b"".join(struct.pack("<h", int(10000*math.sin(2*math.pi*freq*i/44100))) for i in range(44100*3))
              w.writeframes(frames); w.close()
          open("testaudio/Notiz.txt", "w").write("keine Audiodatei")
          PY
          ls -la testaudio
      - name: Capture simulator screenshots
        run: |
          set -e
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys, re
          d = json.load(sys.stdin)["devices"]
          def rtkey(rt):
              m = re.search(r"iOS-(\d+)-(\d+)", rt)
              return (int(m.group(1)), int(m.group(2))) if m else (0, 0)
          best = None
          for rt, devs in d.items():
              if "iOS" not in rt: continue
              for x in devs:
                  if "iPhone" in x["name"]:
                      cand = (rtkey(rt), "Pro" in x["name"], x["udid"])
                      if best is None or cand > best: best = cand
          print(best[2])')
          echo "Simulator: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/sim/Build/Products/Debug-iphonesimulator/Era.app
          mkdir -p screenshots
          xcrun simctl launch "$UDID" de.malte.era --era-demo
          sleep 4
          xcrun simctl io "$UDID" screenshot screenshots/01-home.png
          xcrun simctl terminate "$UDID" de.malte.era
          xcrun simctl launch "$UDID" de.malte.era --era-demo --era-library
          sleep 2
          xcrun simctl io "$UDID" screenshot screenshots/02-library.png
          xcrun simctl terminate "$UDID" de.malte.era
          xcrun simctl launch "$UDID" de.malte.era --era-demo --era-player
          sleep 3
          xcrun simctl io "$UDID" screenshot screenshots/03-player.png
          xcrun simctl terminate "$UDID" de.malte.era
          xcrun simctl launch "$UDID" de.malte.era --era-demo --era-settings
          sleep 2
          xcrun simctl io "$UDID" screenshot screenshots/04-settings.png
          xcrun simctl terminate "$UDID" de.malte.era
      - name: Import pipeline test with real audio files
        run: |
          set -e
          UDID=$(xcrun simctl list devices booted -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for a in d.values() for x in a))')
          CONTAINER=$(xcrun simctl get_app_container "$UDID" de.malte.era data)
          mkdir -p "$CONTAINER/Documents/ImportTest"
          cp testaudio/*.wav testaudio/*.txt "$CONTAINER/Documents/ImportTest/"
          xcrun simctl launch "$UDID" de.malte.era --era-import-test --era-library
          sleep 8
          xcrun simctl io "$UDID" screenshot screenshots/05-import-test.png
          xcrun simctl terminate "$UDID" de.malte.era
          echo "--- library.json after import test ---"
          cat "$CONTAINER/Library/Application Support/EraLibrary/library.json" | python3 -m json.tool | head -40
          ls -la "$CONTAINER/Library/Application Support/EraLibrary/"
      - uses: actions/upload-artifact@v4
        with:
          name: Era-v3
          path: |
            Era-v3-unsigned.ipa
            screenshots/*.png
