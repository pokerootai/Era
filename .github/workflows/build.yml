name: Era Offline v2
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build device app
        run: |
          xcodebuild -project Era.xcodeproj -scheme Era -configuration Release -sdk iphoneos -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO build
          mkdir -p Payload
          cp -R build/device/Build/Products/Release-iphoneos/Era.app Payload/
          zip -qry Era-Offline-v2-unsigned.ipa Payload
      - name: Verify unsigned device IPA
        run: |
          file Payload/Era.app/Era
          lipo -info Payload/Era.app/Era
          test ! -d Payload/Era.app/_CodeSignature
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' Payload/Era.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' Payload/Era.app/Info.plist
      - name: Build simulator
        run: xcodebuild -project Era.xcodeproj -scheme Era -configuration Debug -sdk iphonesimulator -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO build
      - name: Capture simulator screenshots
        run: |
          set -e
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for a in d.values() for x in a if "iPhone 16 Pro" in x["name"]))')
          xcrun simctl boot "$UDID" || true
          open -a Simulator
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/sim/Build/Products/Debug-iphonesimulator/Era.app
          xcrun simctl launch "$UDID" de.malte.era --era-demo
          sleep 4
          mkdir -p screenshots
          xcrun simctl io "$UDID" screenshot screenshots/01-home.png
          xcrun simctl terminate "$UDID" de.malte.era
          xcrun simctl launch "$UDID" de.malte.era --era-demo --era-library
          sleep 2
          xcrun simctl io "$UDID" screenshot screenshots/02-library.png
      - uses: actions/upload-artifact@v4
        with:
          name: Era-Offline-v2
          path: |
            Era-Offline-v2-unsigned.ipa
            screenshots/*.png
