    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.malte.era
        PRODUCT_NAME: Era
        MARKETING_VERSION: "3.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
